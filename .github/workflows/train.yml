# Lab 3, Part 5: train the candidates and run the promotion gate on every pull request and every push to main.
# Red run = the gate blocked a model that is not good enough. That red run is what you show in your video.
# Pins are the same full commit SHAs as in ci.yml. Update them on purpose, never by accident.
name: train-and-gate

on:
  pull_request:
    branches: [main]
    paths: ["src/**", "data/**", "scripts/**", "requirements*.txt", "artifacts/**", ".github/workflows/train.yml"]
  push:
    branches: [main]
    paths: ["src/**", "data/**", "scripts/**", "requirements*.txt", "artifacts/**", ".github/workflows/train.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: train and gate
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the gate reads the champion from the previous commit, so it needs history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Start MLflow (a fresh server for this run)
        run: docker compose -f docker-compose.mlflow.yml up -d --wait

      - name: Find the champion to beat (from the base branch, or the previous commit)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then BASE=HEAD; fi
          git show "${BASE:-HEAD~1}:artifacts/champion.json" > "$RUNNER_TEMP/champion.json" 2>/dev/null \
            && echo "Champion found:" && cat "$RUNNER_TEMP/champion.json" \
            || { echo "No champion on the base yet: the first good model will be promoted."; rm -f "$RUNNER_TEMP/champion.json"; }

      - name: Train the candidates
        run: |
          echo "BATCH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          BATCH="${GITHUB_SHA::7}" python -m src.train.train_mlflow

      - name: Promotion gate (exit code 1 = blocked)
        run: python scripts/promote.py --champion-file "$RUNNER_TEMP/champion.json"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Gate"
            echo "Batch \`${GITHUB_SHA::7}\`. See the step above for PROMOTED or BLOCKED."
            echo "To record a promotion, commit \`artifacts/champion.json\`, \`artifacts/metadata.json\` and \`artifacts/model.joblib\` from your own run of \`scripts/promote.py\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build champion image after successful promotion
        if: github.event_name != 'pull_request'
        run: |
          echo "IMAGE=churn-api:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "churn-api:${GITHUB_SHA::7}" .

      - name: Run champion and smoke test
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name churn-gate-api -p 8000:8000 "$IMAGE"
          bash scripts/smoke_test.sh http://localhost:8000
          curl -fsS http://localhost:8000/health > health.json
          python -c 'import json,os; h=json.load(open("health.json")); m=json.load(open("artifacts/metadata.json")); assert h["model_version"] == os.environ["GITHUB_SHA"][:7]; assert h["mlflow_run_id"] == m["mlflow_run_id"]'

      - name: MLflow diagnostics
        if: failure()
        run: docker compose -f docker-compose.mlflow.yml logs --tail=100
      - name: Cleanup
        if: always()
        run: |
          docker rm -f churn-gate-api || true
          docker compose -f docker-compose.mlflow.yml down
