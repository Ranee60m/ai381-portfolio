# Lab 3: lint and test every pull request and relevant main-branch change.
name: Lab 3 CI
# Model promotion and image builds live in lab3-train.yml.

on:
  pull_request:          # every pull request: `test` is the required check that protects main
    branches: [main]
  push:                  # test when Lab 3 code or test configuration changes
    branches: [main]
    paths:
      - "lab3/src/**"
      - "lab3/tests/**"
      - "lab3/data/**"
      - "lab3/requirements*.txt"
      - "lab3/Dockerfile"
      - ".github/workflows/lab3-ci.yml"
      - ".github/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lab 3 test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab3/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Train (the quality gate is inside)
        run: python -m src.train.train
      - name: Test
        run: pytest -q tests
